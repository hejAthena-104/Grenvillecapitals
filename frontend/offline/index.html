<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#12325a">
	<title>You're offline | Grenville Capitals</title>
	<link rel="icon" href="/static/images/pwa/favicon.ico">
	<link rel="apple-touch-icon" href="/static/images/pwa/apple-touch-icon.png">
	<link rel="stylesheet" href="/static/css/style.css">
	<link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.css">
	<style>
		body { background:#f6f4ef; }
		.offline-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
		.offline-card { max-width:520px; }
		.offline-card img { width:230px; margin-bottom:34px; }
		.offline-card .bi { font-size:52px; color:#b0762e; display:block; margin-bottom:18px; }
		.offline-card h1 { color:#12325a; font-size:30px; font-weight:700; margin-bottom:14px; }
		.offline-card p { color:#4a5a6a; margin-bottom:28px; }
		.offline-card .btn { background:#12325a; border-color:#12325a; color:#fff; border-radius:50px; padding:12px 34px; }
		.offline-card .btn:hover { background:#0a1526; border-color:#0a1526; color:#fff; }
	</style>
</head>
<body>
	<div class="offline-wrap">
		<div class="offline-card">
			<img src="/static/images/logo.png" alt="Grenville Capitals">
			<i class="bi bi-wifi-off"></i>
			<h1>You're offline</h1>
			<p>We can't reach Grenville Capitals right now. Check your connection and try again — pages you've already visited stay available offline.</p>
			<a href="/" class="btn" onclick="location.reload();return false;">Try again</a>
		</div>
	</div>
</body>
</html>
