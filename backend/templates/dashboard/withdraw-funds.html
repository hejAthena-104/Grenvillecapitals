{% extends 'base_dashboard.html' %}
{% load static %}
{% load humanize %}

{% block title %}Complete Withdrawal Request | {{ site_name }}{% endblock %}

{% block content %}
        <div class="container-fluid mb-5">
                <!-- Title -->
    <h1 class="h2">
        Complete withdrawal request
    </h1>
        <div>
    </div>
    <div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <div class="mb-5 row">
                        <div class="col-lg-8 offset-md-2">
                            <div class="mb-3">
                                <h4 class="h2"> <i class="bi bi-cursor"></i> USDT</h4>
                            </div>
                                                            <form action="{% url 'dashboard:withdraw_funds' %}" method="post">
                                    {% csrf_token %}                                    <div class="mb-3">
                                        <label class="">Enter Amount to
                                            withdraw($)</label>
                                        <input class="form-control " placeholder="Enter Amount" type="number"
                                            name="amount" step="any" required>
                                    </div>
                                    <input value="USDT" type="hidden" name="method">

                                    <div class="mb-3">
                                        <button class="btn btn-primary" type='submit'>Complete Request</button>
                                    </div>
                                </form>
                                                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
        </div>

        <!-- Footer -->
        
{% endblock %}
