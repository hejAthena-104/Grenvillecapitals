{% load nav %}{% active_tab as tab %}
<nav class="gc-tabbar" aria-label="Main">
    <a href="{% url 'dashboard:index' %}" class="gc-tab {% if tab == 'home' %}active{% endif %}"
       {% if tab == 'home' %}aria-current="page"{% endif %}>
        <i class="bi bi-house{% if tab == 'home' %}-fill{% endif %}"></i>
        <span>Home</span>
    </a>

    <a href="{% url 'dashboard:account_history' %}" class="gc-tab {% if tab == 'activity' %}active{% endif %}"
       {% if tab == 'activity' %}aria-current="page"{% endif %}>
        <i class="bi bi-clock-history"></i>
        <span>Activity</span>
    </a>

    <a href="{% url 'dashboard:transfers' %}" class="gc-tab gc-tab--send {% if tab == 'send' %}active{% endif %}"
       {% if tab == 'send' %}aria-current="page"{% endif %}>
        <span class="gc-tab-fab"><i class="bi bi-arrow-up-right"></i></span>
        <span>Send</span>
    </a>

    <a href="{% url 'dashboard:cards' %}" class="gc-tab {% if tab == 'cards' %}active{% endif %}"
       {% if tab == 'cards' %}aria-current="page"{% endif %}>
        <i class="bi bi-credit-card-2-front{% if tab == 'cards' %}-fill{% endif %}"></i>
        <span>Cards</span>
    </a>

    <a href="{% url 'dashboard:profile' %}" class="gc-tab {% if tab == 'profile' %}active{% endif %}"
       {% if tab == 'profile' %}aria-current="page"{% endif %}>
        <i class="bi bi-person{% if tab == 'profile' %}-fill{% endif %}"></i>
        <span>Profile</span>
    </a>
</nav>
